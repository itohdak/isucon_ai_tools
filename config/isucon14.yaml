environment: isucon14
aws:
  profile: isucon15.prep
  region: ap-northeast-1
  stack_name: isucon14
ssh:
  user: ubuntu
  private_key_path: /home/itohdak/Downloads/isucon.pem
hosts:
  app:
    name: isucon13-1
    public_ip: 13.230.132.249
    private_ip: 192.168.0.11
    app_path: /home/isucon/webapp
  bench:
    name: isucon14-bench
    public_ip: 35.78.44.172
    private_ip: 192.168.0.12
    bench_binary: /home/isucon/bench
  db:
    name: isucon14-db
    public_ip: 18.176.6.65
    private_ip: 192.168.0.13
    role: dedicated MySQL host (split from app host on 2026-09-23)
    instance_id: i-09b55e06484e998b7
    provisioned_via: "CloudFormation stack 'isucon14', logical resources Instance3/InstanceIP3 (previously present in the template but not deployed)"
    app_services_disabled: [isuride-go.service, isuride-matcher.service, isuride-payment_mock.service, nginx.service]
benchmark:
  working_directory: /home/isucon
  command:
    - sudo
    - -u
    - isucon
    - ./bench
    - run
    - --target
    - https://bench.xiv.isucon.net
    - --addr
    - 192.168.0.11:443
    - --payment-bind-port
    - "12346"
    - --payment-url
    - http://192.168.0.12:12346
  target_url: https://bench.xiv.isucon.net
  target_addr: 192.168.0.11:443
  payment_bind_port: 12346
  payment_url: http://192.168.0.12:12346
  baseline_score:
    score: 1002
    pass: true
    measured_at: "2026-09-21"
mysql:
  host: 192.168.0.13
  port: 3306
  database: isuride
  version: 8.0.46-0ubuntu0.24.04.3
  access_method: "sudo mysql on the db host (192.168.0.13); app connects over TCP as user isucon"
  split_from_app_host: true
  split_date: "2026-09-23"
  app_env_sh_setting: 'ISUCON_DB_HOST="192.168.0.13"'
  bind_address_override: s3/etc/mysql/mysql.conf.d/mysqld.cnf (bind-address 0.0.0.0, restricted at network layer by the security group to 192.168.0.0/24)
  remote_user_setup: "created by webapp/sql/0-init.sql ('isucon'@'%'), run manually once on the db host since it is not part of the recurring /api/initialize -> init.sh flow"
  mcp_verified: true
  current_top_slow_query: SELECT * FROM rides WHERE chair_id IS NULL ORDER BY created_at LIMIT 1
  current_top_slow_query_explain_extra: Using where; Using filesort
git:
  startup_checklist: docs/isucon-startup-checklist.md
  template_repository: https://github.com/itohdak/isucon_template
  remote_origin: null
  remote_status: not_configured
  app_repo_path: /home/isucon
  app_source_path: /home/isucon/webapp
  config_capture_path: /home/isucon/common
  per_server_config_paths:
    s1: /home/isucon/s1
    s2: /home/isucon/s2
    s3: /home/isucon/s3
  initial_commit_message: initial state
  initial_commit_hash: f0b44a2
  observability_commit_hash: 18cd32d
  template_layout_commit_hash: c9292f8
  branch: main
  tracked_initial_paths:
    - /home/isucon/webapp
    - /home/isucon/common
    - /home/isucon/s1
    - /home/isucon/s2
    - /home/isucon/s3
    - /home/isucon/.gitignore
  iteration_policy:
    - keep git status clean before each hypothesis
    - make one logical change per benchmark
    - commit only improved and valid changes
    - restore or revert regressed changes
  never_commit:
    - raw secrets from /home/isucon/env.sh
    - private keys
    - large generated logs
    - build caches and __pycache__
  mcp_verified: true
  latest_status: clean
logs:
  startup_checklist: docs/isucon-startup-checklist.md
  observability_enabled: true
  app_journal_units:
    - isuride-go.service
    - isuride-matcher.service
    - isuride-payment_mock.service
  nginx_access_log: /var/log/nginx/access.log
  nginx_access_log_format: ltsv
  nginx_error_log: /var/log/nginx/error.log
  mysql_error_log: /var/log/mysql/error.log
  mysql_slow_log: /var/log/mysql/mysql-slow.log
  mysql_slow_log_expected:
    slow_query_log: true
    long_query_time: 0.0
  mcp_verified: true
  latest_top_route: /api/chair/notification
api_aggregation:
  tool: alp or pprotein
  matching_groups:
    - ^/api/app/users$
    - ^/api/app/payment-methods$
    - ^/api/app/nearby-chairs$
    - ^/api/app/rides$
    - ^/api/app/rides/estimated-fare$
    - ^/api/app/rides/[^/]+/evaluation$
    - ^/api/app/notification$
    - ^/api/chair/chairs$
    - ^/api/chair/activity$
    - ^/api/chair/coordinate$
    - ^/api/chair/rides/[^/]+/status$
    - ^/api/chair/notification$
    - ^/api/owner/owners$
    - ^/api/owner/chairs$
    - ^/api/owner/chairs/[^/]+$
    - ^/api/owner/sales$
    - ^/api/internal/matching$
pprotein:
  enabled: true
  host: s2
  public_ip: 35.78.44.172
  private_ip: 192.168.0.12
  base_url: http://127.0.0.1:9000
  internal_url: http://s2:9000
  dashboard_url: http://127.0.0.1:9000/#/group/
  targets_file: /home/isucon/data/targets.json
  ssh_tunnel: ssh -i /home/itohdak/Downloads/isucon.pem -L 9000:127.0.0.1:9000 ubuntu@35.78.44.172
  collection:
    mode: initialize_hook
    collect_endpoint: /api/group/collect
    timeout_seconds: 90
    trigger_options:
      - manual
      - agent
      - initialize_hook
  notes:
    - Current practice policy is to collect pprotein from the application when bench calls POST /api/initialize.
    - The initialize hook should call the pprotein collect endpoint asynchronously and best-effort.
    - The hook must never fail initialization when pprotein is unavailable.
    - Manual collect remains available as a fallback for human-controlled runs.
netdata:
  enabled: true
  parent:
    host: s2
    private_ip: 192.168.0.12
    port: 19999
    url: http://192.168.0.12:19999
  dashboard_url: http://127.0.0.1:19999
  ssh_tunnel: ssh -i /home/itohdak/Downloads/isucon.pem -L 19999:127.0.0.1:19999 ubuntu@35.78.44.172
  hosts:
    app: s1
    bench: s2
  notes:
    - All instances (webapp + pprotein) stream their metrics to the netdata parent running on the pprotein host; see isucon_ansible/roles/general (stream.conf.parent.j2 / stream.conf.child.j2).
    - Per-host metrics are queried through the parent at http://<parent>:19999/host/<netdata_hostname>/api/v1/... using the hostnames listed in `hosts` above.
services:
  app:
    - isuride-go.service
    - isuride-matcher.service
    - isuride-payment_mock.service
    - mysql.service
    - nginx.service
deploy:
  command: cd /home/isucon/common && sudo -u isucon bash ./deploy.sh
  timeout_seconds: 180
  health_services:
    - isuride-go.service
    - isuride-matcher.service
    - isuride-payment_mock.service
    - mysql.service
    - nginx.service
notes:
  - Direct IP targets hit the default nginx vhost and make /client return 404.
  - Use --target with a *.xiv.isucon.net host and --addr with the app private IP.
  - The bench host runs the AMI payment_mock on :12345, so benchmark runs use :12346.
  - Do not store database passwords or AWS secrets in this file.
