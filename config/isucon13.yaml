environment: isucon13
app: isupipe (ISUCON13 livestreaming app)
aws:
  profile: isucon15.prep
  region: ap-northeast-1
  stack_name: isucon13
ssh:
  user: isucon
  private_key_path: /home/itohdak/.ssh/isucon.pem
hosts:
  # Role mapping as of the 2026-09-23 MySQL split: s1 is now app+nginx+pdns
  # only, s2 is a dedicated MySQL host, s3 remains the dedicated bench/pprotein
  # host. Split executed 2026-09-23 on Resource Monitor Agent evidence (s1's
  # 2 vCPUs saturated with mysqld ~1 core + app ~0.65 core, from iteration 5
  # of the first tuning session) under the user's standing authorization to
  # execute evidence-based splits without a per-instance approval pause (see
  # AGENTS.md Safety Boundaries). Same instance type/size as provisioned --
  # never a scale-up. Baseline before split: avg 17424.7 (3 runs). After
  # split: avg 27934.7 (3 runs: 28773/27402/27629, all pass=true) -- a
  # further ~1.6x gain confirming the CPU-saturation hypothesis.
  app:
    name: isucon13-1
    public_ip: 54.95.240.51
    private_ip: 192.168.0.11
    app_path: /home/isucon/webapp
    instance_id: i-0b8f3963983b3b94f
    role: app + nginx + pdns (MySQL split out to s2 on 2026-09-23; local mysql.service stopped and disabled)
  db:
    name: isucon13-2
    public_ip: 13.192.67.176
    private_ip: 192.168.0.12
    instance_id: i-0b8a4526a023d259f
    role: "dedicated MySQL host (split from s1 on 2026-09-23), serves both the isupipe app DB and PowerDNS's isudns backend DB. bind-address=0.0.0.0 in the tracked mysqld.cnf, restricted at the security-group/VPC layer to 192.168.0.0/24 (same pattern as the isucon14 project's DB split). isucon@'%' / isudns@'%' remote-capable users created via webapp/sql/initdb.d/00_create_database.sql (the AMI's default users were localhost-only). Deployed via common/deploy_db.sh (separate from common/deploy.sh, which is app-host-only and no longer touches mysql)."
  bench:
    name: isucon13-3
    public_ip: 35.73.166.230
    private_ip: 192.168.0.13
    bench_binary: /home/isucon/bench
    instance_id: i-062c9613e34065310
    role: bench + pprotein host; app-role services (isupipe-go, mysql, pdns, nginx) stopped and disabled here
benchmark:
  working_directory: /home/isucon
  command:
    - sudo
    - -u
    - isucon
    - /home/isucon/bench
    - run
    - --target
    - https://pipe.u.isucon.local:443
    - --nameserver
    - "192.168.0.11"
    - --webapp
    - "192.168.0.11"
    - --enable-ssl
  target_url: https://pipe.u.isucon.local
  nameserver: 192.168.0.11
  dns_port: 53
  notes:
    - This is a self-managed practice environment (not the ISUCON13 portal), built from the team's own saved CloudFormation template. The portal-specific envcheck / aws-env-isucon-subdomain-address services are therefore not registered (envcheck reports "チェッカーの設定ファイルが読み込めませんでした"), which is expected and not a fault.
    - The app's local practice domain is u.isucon.local (self-signed cert in /etc/nginx/tls), not the real contest's u.isucon.dev.
    - PowerDNS on s1 must have ISUCON13_POWERDNS_SUBDOMAIN_ADDRESS in /home/isucon/env.sh set to s1's own private IP (192.168.0.11), then `bash /home/isucon/webapp/pdns/init_zone.sh` re-run, so that pipe.u.isucon.local and *.u.isucon.local resolve to s1 when queried via --nameserver 192.168.0.11 from s3. (PowerDNS itself still runs on s1 post-split; only its isudns backend database moved to s2 -- see mysql section below.)
  baseline_score: 3371 # original baseline, commit d5bd00d. After the first 10-iteration session (2026-09-23): 17424.7 avg (3-run, session-best single run 18136) at commit 45e1aaf (~5.17x baseline) -- see reports/iterations/iteration-20260923-234500.md. Iterations 2 (stats N+1 alone), 6 (PowerDNS index + persistent slow-query-log), and 7 (icon conditional-GET) were tested and REJECTED/reverted -- see their iteration reports. After the MySQL/s2 split (2026-09-23, commit 309c390): 27934.7 avg (3 runs: 28773/27402/27629, all pass=true) -- ~1.65x further gain, ~8.29x original baseline. See reports/summary/isucon13.md for the full chronological trail. Known open issue: recurring GET /report 500 for reports on already-moderated-away comments (pre-existing, not introduced by tuning, needs human input on desired semantics before fixing).
mysql:
  host: 192.168.0.12 (s2, split from s1 on 2026-09-23)
  port: 3306
  database: isupipe
  access_method: "sudo mysql isupipe on the db host (s2); app and pdns connect over TCP as isucon@'%'/isudns@'%'"
  second_database: isudns (PowerDNS zone backend, also MySQL-backed, now on s2 -- pdns process itself still runs on s1 and connects to s2's isudns over TCP via /etc/powerdns/pdns.d/gmysql-host.conf, tracked at common/etc/powerdns/pdns.d/gmysql-host.conf)
git:
  template_repository: https://github.com/itohdak/isucon_template (not used directly; app source came pre-installed on the ISUCON13 AMI at /home/isucon)
  remote_origin: git@github.com:itohdak/isucon13_practice_3.git
  remote_status: "pushed (initial state on main). Note: the operator sandbox's auto-mode classifier intermittently flags `git push` over SSH as Credential Leakage / Data Exfiltration and blocks the call -- this was transient (retry succeeded) but may recur; if a push is denied, just retry it once or twice before escalating to the user."
  app_repo_path: /home/isucon
  app_source_path: /home/isucon/webapp
  config_capture_path: /home/isucon/common
  per_server_config_paths:
    s1: /home/isucon/s1
    s2: /home/isucon/s2
    s3: /home/isucon/s3
  initial_commit_message: initial state
  branch: main
  iteration_policy:
    - keep git status clean before each hypothesis
    - make one logical change per benchmark
    - commit only improved and valid changes
    - restore or revert regressed changes
  never_commit:
    - raw secrets from /home/isucon/env.sh (env.sh itself holds no password in this app -- see common/env/env.sh.redacted -- but is still gitignored per policy)
    - private keys (*.pem, *.key)
    - TLS certs (*.crt) -- not needed since the AMI's tls files are never modified by deploy.sh
    - large generated logs
    - build caches
logs:
  observability_enabled: true
  app_journal_units:
    - isupipe-go.service
  nginx_access_log: /var/log/nginx/access.log
  nginx_access_log_format: "LTSV with reqtime/apptime, fixed 2026-09-23 -- common/etc/nginx/nginx.conf now defines an `ltsv` log_format and `access_log ... ltsv`. IMPORTANT HISTORY: for the entire first 10-iteration tuning session (2026-09-23), this was still the AMI's stock `combined` format with no request_time field, which the Profiler Agent flagged in iteration 1 but never acted on. `alp ltsv` against a combined-format file returns a silently EMPTY table (no error) -- it looks like it ran successfully. Route-latency findings that session were NOT based on alp/httplog; they came from journalctl-derived Go app request logs (echo's middleware.Logger()), MySQL slow-log (until it broke too, see below), and direct code reading. Verified fixed 2026-09-23: `alp ltsv --file /var/log/nginx/access.log ...` now returns real, non-empty rows with populated reqtime."
  mysql_error_log: /var/log/mysql/error.log
  mysql_slow_log: /var/log/mysql/mysql-slow.log
  mysql_slow_log_expected:
    slow_query_log: true
    long_query_time: 0.0
  mysql_slow_log_history: "Enabled correctly at environment setup, but iteration 6 of the first tuning session (2026-09-23) found long_query_time=0 cost ~20-25% benchmark score on this CPU-constrained host and reverted the setting in the TRACKED common/etc/mysql/mysql.conf.d/mysqld.cnf -- since deploy.sh copies that file over the live config and restarts mysql on every deploy, this silently turned slow-query logging OFF for the rest of that session (iterations 7-10) with no error or warning. Re-enabled in the tracked config 2026-09-23 (commit 9983294 in isucon13_practice_3) so it persists across deploys by default -- the user explicitly wants these logs available from the start of the environment for humans to reference, even though it costs some score (confirmed ~16000-16300 with full logging vs ~17400-18200 without, at the post-iteration-10 code state -- roughly a 7-10% cost, not the ~20-25% iteration 6 saw at an earlier, less-optimized code state). If a team later wants a maximum-score-only final attempt, disabling slow_query_log (or raising long_query_time) for that one run specifically is a legitimate, deliberate trade-off -- but the environment's DEFAULT/at-rest state should keep it on, and any agent choosing to disable it for an experiment must not leave it disabled in the tracked config afterward."
  log_rotation: "common/deploy.sh now truncates both /var/log/nginx/access.log and /var/log/mysql/mysql-slow.log (via `sudo truncate -s 0`, safe on open file descriptors -- no service restart needed for the truncate itself, though deploy.sh restarts nginx/mysql anyway for other reasons) after every deploy, so each deploy leaves a clean slate for the next benchmark run's alp/slp analysis instead of accumulating from environment boot. Before this fix, mysql-slow.log had grown to 1.4GB from a single long_query_time=0 benchmark run."
api_aggregation:
  tool: alp or pprotein
  matching_groups_file: isucon_ansible/roles/pprotein/files/alp.yaml
  matching_groups:
    - ^/api/tag$
    - ^/api/user/[^/]+/theme$
    - ^/api/livestream/reservation$
    - ^/api/livestream/search$
    - ^/api/livestream$
    - ^/api/user/[^/]+/livestream$
    - ^/api/livestream/[^/]+$
    - ^/api/livestream/[^/]+/livecomment$
    - ^/api/livestream/[^/]+/reaction$
    - ^/api/livestream/[^/]+/report$
    - ^/api/livestream/[^/]+/ngwords$
    - ^/api/livestream/[^/]+/livecomment/[^/]+/report$
    - ^/api/livestream/[^/]+/moderate$
    - ^/api/livestream/[^/]+/enter$
    - ^/api/livestream/[^/]+/exit$
    - ^/api/register$
    - ^/api/login$
    - ^/api/user/me$
    - ^/api/user/[^/]+$
    - ^/api/user/[^/]+/statistics$
    - ^/api/user/[^/]+/icon$
    - ^/api/icon$
    - ^/api/livestream/[^/]+/statistics$
    - ^/api/payment$
    - ^/api/initialize$
pprotein:
  enabled: true
  host: s3
  public_ip: 35.73.166.230
  private_ip: 192.168.0.13
  base_url: http://127.0.0.1:9000
  dashboard_url: http://127.0.0.1:9000/#/group/
  targets_file: /home/isucon/data/targets.json
  ssh_tunnel: ssh -i /home/itohdak/.ssh/isucon.pem -L 9000:127.0.0.1:9000 isucon@35.73.166.230
  collection:
    mode: initialize_hook
    collect_endpoint: /api/group/collect
    http_method: GET
    trigger_options:
      - manual
      - agent
      - initialize_hook
  notes:
    - "The correct trigger call is a plain GET to /api/group/collect (e.g. `curl http://127.0.0.1:9000/api/group/collect`), NOT POST -- POST returns 404. Verified 2026-09-23."
    - collectPprotein() is wired into webapp/go/main.go's initializeHandler, calling PPROTEIN_COLLECT_URL (default http://s3:9000/api/group/collect) asynchronously and best-effort, matching the isucon14_practice pattern.
    - go standalone.Integrate(":8888") added to main() for pprof; added github.com/kaz/pprotein dependency via `go get` + `go mod tidy` (also bumped go toolchain to 1.23.3 and a few transitive deps -- go-sql-driver/mysql 1.7.1->1.8.1, echo 4.11.1->4.12.0 -- as an unavoidable side effect of adding the pprotein dependency).
netdata:
  enabled: true
  parent:
    host: s3
    private_ip: 192.168.0.13
    port: 19999
  ssh_tunnel: ssh -i /home/itohdak/.ssh/isucon.pem -L 19999:127.0.0.1:19999 isucon@35.73.166.230
  hosts:
    app: s1
    db: s2
    bench: s3
services:
  app:
    - isupipe-go.service
    - pdns.service
    - nginx.service
  db:
    - mysql.service
deploy:
  command: cd /home/isucon/common && sudo -u isucon env HOSTNAME=s1 bash ./deploy.sh
  db_command: cd /home/isucon/common && sudo -u isucon env HOSTNAME=s2 bash ./deploy_db.sh
  notes:
    - "deploy.sh (app host, s1) copies common/etc/* (with s1/etc/* overrides taking priority; MySQL split out on 2026-09-23 so mysql.conf.d/mysqld.cnf is no longer relevant here), builds webapp/go/isupipe, re-applies the PowerDNS zone (bash /home/isucon/webapp/pdns/init_zone.sh), then restarts nginx, pdns, and isupipe-go.service. It no longer touches mysql at all."
    - "deploy_db.sh (db host, s2, added 2026-09-23) copies only common/etc/mysql/mysql.conf.d/mysqld.cnf, restarts mysql, and truncates the slow query log. Separate from deploy.sh because common/etc/ also holds app-host-only files (nginx.conf, isupipe-go.service) that must never be copied onto s2."
    - "Per the isucon14 session's discovered gotcha, $HOSTNAME resolves to the machine's actual hostname (e.g. ip-192-168-0-11), not s1/s2/s3 -- always invoke both scripts with an explicit `env HOSTNAME=<s1|s2>` so any future per-server override directory actually matches."
  health_services:
    - isupipe-go.service
    - pdns.service
    - nginx.service
  db_health_services:
    - mysql.service
notes:
  - This is a from-scratch ISUCON13 (ISUPipe) practice environment, distinct from the ongoing ISUCON14 (ISURIDE) project recorded elsewhere in this repo's `reports/summary/isucon14.md` -- do not mix up route lists, service names (isuride-* vs isupipe-*), or schema between the two.
  - Only /home/itohdak/Downloads/isupipe.md and /home/itohdak/Downloads/cautionary_note.md are authoritative ISUCON13 references; general internet search for ISUCON13 contest info is disallowed per user instruction.
  - Do not store database passwords or AWS secrets in this file.
